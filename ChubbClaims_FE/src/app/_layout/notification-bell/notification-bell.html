<button
  mat-icon-button
  type="button"
  [matMenuTriggerFor]="menu"
  (menuOpened)="refreshNow()"
  [attr.aria-label]="unread() ? unread() + ' unread notifications' : 'Notifications'"
  title="Notifications"
>
  <mat-icon [matBadge]="unread()" [matBadgeHidden]="unread() === 0" aria-hidden="true"
    >notifications</mat-icon
  >
</button>

<mat-menu #menu="matMenu" xPosition="before" class="notification-menu">
  <div class="header" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <strong>Notifications</strong>
    <button mat-button type="button" [disabled]="unread() === 0" (click)="markAllRead()">
      Mark all read
    </button>
  </div>
  <mat-divider />

  @for (n of items(); track n.id) {
    <button mat-menu-item type="button" class="item" [class.unread]="!n.isRead" (click)="open(n)">
      <span class="text">
        <span class="message">{{ n.message }}</span>
        <span class="meta">{{ n.claimNumber }} · {{ ago(n.createdAt) }}</span>
      </span>
    </button>
  } @empty {
    <p class="empty">No notifications yet. You'll hear a chime when one arrives.</p>
  }

  <mat-divider />
  <button mat-menu-item type="button" (click)="sound.toggle()">
    <mat-icon>{{ sound.enabled() ? 'volume_up' : 'volume_off' }}</mat-icon>
    <span>Sound {{ sound.enabled() ? 'on' : 'off' }}</span>
  </button>
</mat-menu>
