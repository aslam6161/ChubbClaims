# docker compose up --build
#   Web app        http://localhost:4200        (nginx; forwards /api and /hubs to the API)
#   API + Scalar   http://localhost:5080/scalar
#   SQL Server     localhost,1433   (sa / MSSQL_SA_PASSWORD from .env)
#   Kafka          localhost:9092   (host)   kafka:29092 (containers)
#   Kafka UI       http://localhost:8085
name: chubbclaims

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.0
    environment:
      # Single-node KRaft (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: INTERNAL for other containers, EXTERNAL for apps on the host (dotnet run / Visual Studio).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.0.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  api:
    build:
      context: ./ChubbClaims_BE
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # dev-only features: Scalar, dev login, seed data
      LogFormat: Json
      ConnectionStrings__ClaimsDb: "Server=sqlserver,1433;Database=ChubbClaims;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Kafka__BootstrapServers: kafka:29092
      # Claim photos and documents: Cloudinary (private) when these are set in .env, otherwise
      # the "documents" volume below. Leave them blank and everything still works.
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Cloudinary__Folder: ${CLOUDINARY_FOLDER:-chubbclaims-dev}
      DocumentStorage__LocalPath: /app/data/documents
    ports:
      - "5080:8080"
    volumes:
      - documents:/app/data/documents
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: ./ChubbClaims_FE
      dockerfile: Dockerfile
    ports:
      - "4200:80"   # the same address as `npm start`, so stop this container to use the dev server
    depends_on:
      - api

volumes:
  sqldata:
  documents:
