# The web app in docker compose: static files, plus /api, /hubs and /health forwarded to the API.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Photos and PDFs can be up to 10 MB. Let a bit more through so the API, not nginx, refuses a
    # larger file, with its own clear message.
    client_max_body_size 12m;

    # Docker's DNS, re-checked every 10 s: the API container can be rebuilt (new IP) without
    # restarting this one. A variable in proxy_pass makes nginx resolve it per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR: WebSockets need the upgrade headers and a long read timeout.
    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass $api;
    }

    # Built files have a content hash in their name (main-6SBR4LSQ.js, chunk-B1u-r8fz.js), so they
    # never change.
    location ~ "^/(main|chunk|polyfills|styles)-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Any other file (favicon, logo): served if it exists, otherwise a real 404, not the app's HTML
    # (a browser asking for a chunk from an older build should hear "not found").
    location ~* "\.[a-z0-9]{2,5}$" {
        try_files $uri =404;
    }

    # Everything else is the single-page app: deep links like /staff/claims/{id} load index.html,
    # which is never cached so a new build is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
}
